name: Windows Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Install frontend dependencies
        run: npm ci
      - name: Restore FFmpeg cache
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/binaries/*.exe
            src-tauri/resources/ffmpeg-LICENSE.txt
          key: ffmpeg-windows-x64-v1
      - name: Prepare bundled FFmpeg
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\prepare-windows-ffmpeg.ps1
      - name: Test web runtime
        run: npm test
      - name: Test native runtime
        run: |
          npm run desktop:frontend
          cargo test --manifest-path src-tauri/Cargo.toml --release --lib --locked
      - name: Build signed Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run desktop:build -- -- --locked
      - name: Prepare installer and update manifest
        id: prepare
        run: node scripts/prepare-release.mjs
      - name: Smoke test Windows installer
        timeout-minutes: 5
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\smoke-windows-release.ps1
      - name: Upload verified installer
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: sales-kit-studio-windows-x64
          path: release-dist/*
          if-no-files-found: error
      - name: Create draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: 帧选 ${{ github.ref_name }} · Windows x64
          body_path: release-dist/release-notes.md
          files: |
            release-dist/*.exe
            release-dist/*.sig
            release-dist/*.sha256
            release-dist/*.json
