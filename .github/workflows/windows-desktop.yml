name: Windows Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Restore FFmpeg cache
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/binaries/*.exe
            src-tauri/resources/ffmpeg-LICENSE.txt
          key: ffmpeg-windows-x64-v1

      - name: Prepare bundled FFmpeg
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\prepare-windows-ffmpeg.ps1

      - name: Test web runtime
        run: npm test

      - name: Build Windows installer
        run: npm run desktop:build

      - name: Prepare release installer
        shell: powershell
        run: |
          $bundleDir = "src-tauri\target\release\bundle\nsis"
          $installer = Get-ChildItem "$bundleDir\*.exe" | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not generated" }
          $version = (Get-Content "src-tauri\tauri.conf.json" | ConvertFrom-Json).version
          $releaseName = "SalesKitStudio_${version}_x64-setup.exe"
          $releasePath = Join-Path (Resolve-Path $bundleDir).Path $releaseName
          if ($installer.FullName -ne $releasePath) {
            Move-Item $installer.FullName $releasePath -Force
          }
          $hash = (Get-FileHash $releasePath -Algorithm SHA256).Hash.ToLower()
          "$hash  $releaseName" | Set-Content "$releasePath.sha256" -Encoding ascii

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: sales-kit-studio-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/SalesKitStudio_*_x64-setup.exe
            src-tauri/target/release/bundle/nsis/SalesKitStudio_*_x64-setup.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/SalesKitStudio_*_x64-setup.exe
            src-tauri/target/release/bundle/nsis/SalesKitStudio_*_x64-setup.exe.sha256
